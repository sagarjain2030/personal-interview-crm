name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit arrives on the same branch/PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium and its system dependencies
        id: chromium
        run: python -m playwright install --with-deps chromium

      # CI has no data/interview_crm.db (it is Git-ignored). The session guard in
      # tests/conftest.py fails the run if any test creates or changes it.
      - name: Database tests
        run: pytest tests/db -v

      - name: Streamlit AppTest tests
        # Run every test layer even if an earlier layer failed, but not if setup failed.
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pytest tests/apptest -v

      - name: Browser tests (headless Chromium)
        # Run every test layer even if an earlier layer failed, but not if setup failed.
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pytest tests/e2e -v

      - name: Upload Playwright screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
