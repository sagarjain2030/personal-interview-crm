[pytest]
testpaths = tests
# "." makes `import db` work; "tests" makes the shared helper modules importable.
pythonpath = . tests
markers =
    e2e: real-browser tests that start a Streamlit server and drive it with Playwright
# Playwright: keep a screenshot and trace for every failing browser test in test-results/.
addopts = --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
